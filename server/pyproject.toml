[project]
name = "visual-portfolio-backend"
version = "1.0.0"
description = "Flask REST API backend for Visual Portfolio"
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.3",
    "Flask-Cors>=4.0",
    "Flask-Limiter>=3.4",
    "Flask-SQLAlchemy>=3.1",
    "flasgger>=0.9.7",
    "google-generativeai>=0.5.0",
    "gunicorn>=21.2.0",
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "marshmallow>=3.20",
    "psycopg2-binary>=2.9",
    "PyJWT>=2.8",
    "python-dotenv>=1.0",
    "requests>=2.31.0",
]

[tool.uv]
package = false
