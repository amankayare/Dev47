<svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .brand-number {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: brand-number-dance 1.4s ease-in-out infinite;
    }

    @keyframes brand-number-dance {
      0%, 100% { transform: translateY(0) rotate(0deg); filter: drop-shadow(0 0 0 #00AFC1); }
      25% { transform: translateY(-2px) rotate(8deg); filter: drop-shadow(0 0 3px #00AFC1); }
      50% { transform: translateY(0) rotate(-7deg); filter: drop-shadow(0 0 1px #00AFC1); }
      75% { transform: translateY(-1px) rotate(5deg); filter: drop-shadow(0 0 3px #00AFC1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand-number { animation: none; }
    }
  </style>
  <!-- Logo symbol, retained for possible reuse:
  <g transform="translate(5, 5)">
    <circle cx="25" cy="25" r="23" fill="none" stroke="#000000" stroke-width="2"/>
    <g transform="translate(25, 25) rotate(45)">
      <path d="M -17 -17 L 17 -17 L 17 0 L -17 0 Z" fill="#3C3C3C"/>
      <path d="M -17 0 L 17 0 L 17 17 L -17 17 Z" fill="#0089E5"/>
      <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="6" fill="#2C2C2C"/>
    </g>
  </g>
  -->
  <text x="0" y="43" transform="rotate(-4 13 30)" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="700" fill="#17323A">D</text>
  <text x="25" y="43" transform="rotate(3 37 30)" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="700" fill="#17323A">E</text>
  <text x="45" y="43" transform="rotate(4 57 30)" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="700" fill="#17323A">V</text>
  <text class="brand-number" x="72" y="25" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#00AFC1">47</text>
</svg>
